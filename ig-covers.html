<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Highlight Covers</title>
  <style>
    body { margin: 0; padding: 20px 16px 40px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #142235; }
    h1 { font-size: 22px; margin: 0 0 6px; color: #15427d; }
    p { margin: 0 0 18px; color: #55657a; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; max-width: 640px; }
    figure { margin: 0; text-align: center; }
    img { width: 100%; height: auto; border-radius: 12px; display: block; }
    figcaption { font-size: 14px; font-weight: 600; margin-top: 6px; }
  </style>
</head>
<body>
  <!-- Temporary page for Betty to save her Instagram highlight covers. Not linked anywhere; remove when done. -->
  <h1>Instagram Highlight Covers</h1>
  <p>Press and hold an image, then tap Save to Photos (iPhone) or Download image (Android).</p>
  <div class="grid">
    <figure><img src="/assets/img/instagram/since-1987-lake.png" alt="Since 1987, lake aerial"><figcaption>Since 1987 (lake)</figcaption></figure>
    <figure><img src="/assets/img/instagram/since-1987-lake-1987.png" alt="Since 1987, lake with 1987"><figcaption>Since 1987 (lake + 1987)</figcaption></figure>
    <figure><img src="/assets/img/instagram/since-1987-navy.png" alt="Since 1987, navy"><figcaption>Since 1987 (navy)</figcaption></figure>
    <figure><img src="/assets/img/instagram/reviews.png" alt="Reviews"><figcaption>Reviews</figcaption></figure>
    <figure><img src="/assets/img/instagram/home-value.png" alt="Home Value"><figcaption>Home Value</figcaption></figure>
    <figure><img src="/assets/img/instagram/buying.png" alt="Buying"><figcaption>Buying</figcaption></figure>
    <figure><img src="/assets/img/instagram/neighborhoods.png" alt="Neighborhoods"><figcaption>Neighborhoods</figcaption></figure>
    <figure><img src="/assets/img/instagram/about-betty.png" alt="About Betty"><figcaption>About Betty</figcaption></figure>
  </div>
</body>
</html>
